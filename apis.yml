- aid: us-department-of-defense:lpms-api
  name: USACE Lock Performance Monitoring System API
  tags:
  - Waterways
  - Navigation
  - Locks
  - Federal-Government
  tags_raw:
  - Waterways
  - Navigation
  - Locks
  - Federal Government
  humanURL: https://corpslocks.usace.army.mil/lpwb/f
  properties:
  - url: https://corpslocks.usace.army.mil/lpwb/f
    type: Documentation
  - url: https://catalog.data.gov/dataset/corps-locks
    type: DataCatalog
  description: >-
    The USACE Lock Performance Monitoring System (LPMS) API provides data on inland waterway lock operations
    across the US Army Corps of Engineers lock system. Endpoints return XML data for lock queue reports
    (past 24 hours), tonnage reports, and traffic reports (past 30 days). Tracks vessel traffic through
    192 commercially active locks on US inland waterways.
